name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compilar y subir imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}

    - name: Configurar Kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Desplegar en Kubernetes
      run: |
        # Reemplazar el placeholder de la imagen por el usuario real
        sed -i 's|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g' k8s/deployment.yaml
        
        # Aplicar manifiestos
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml
        
        # Forzar actualización con la nueva imagen y esperar el rollout
        kubectl set image deployment/webapp-deployment webapp=${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}
        kubectl rollout status deployment/webapp-deployment --timeout=120s